spring.application.name=github-repo-search-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/githubdb}
spring.datasource.username=${DB_USERNAME:github}
spring.datasource.password=${DB_PASSWORD:github}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=8080

# GitHub API client
github.api.base-url=${GITHUB_API_URL:https://api.github.com}
github.token=${GITHUB_TOKEN:}
github.api.connect-timeout-ms=3000
github.api.read-timeout-ms=10000
