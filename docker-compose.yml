services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: githubdb
      POSTGRES_USER: github
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-github}
    ports:
      - "5434:5432"
    volumes:
      - github_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U github -d githubdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/githubdb
      DB_USERNAME: github
      DB_PASSWORD: ${POSTGRES_PASSWORD:-github}
    ports:
      - "8081:8080"

volumes:
  github_pgdata:
